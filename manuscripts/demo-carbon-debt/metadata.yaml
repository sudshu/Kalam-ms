research_question: >
  Do repeated hot-dry extremes leave tropical forests with less ecosystem carbon after
  20 years than the same background climate trajectory without the extreme anomalies?
core_finding: >
  Carbon fluxes return to their baseline range within 6-18 months after most events,
  but ecosystem carbon stocks at year 20 remain lower in 73% of simulations, with a
  pooled median deficit of 1.9 Mg C ha-1. Flux recovery does not imply stock recovery.
